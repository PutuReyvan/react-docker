name: Backend DevSecOps Pipeline

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-devsecops.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-devsecops.yml'

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read
  security-events: write

env:
  BACKEND_APP_DIR: backend
  BACKEND_IMAGE_NAME: ghcr.io/putureyvan/invoice-api
  BACKEND_LOCAL_IMAGE: invoice-api:${{ github.sha }}

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend-mongodb-integration-tests:
    name: MongoDB Integration Tests
    runs-on: ubuntu-latest
    needs: backend-validation
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/invoice_api_test
      MONGODB_DB_NAME: invoice_api_test
    defaults:
      run:
        working-directory: ${{ env.BACKEND_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run MongoDB integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  backend-sast-codeql:
    name: Backend SAST - CodeQL
    runs-on: ubuntu-latest
    needs: backend-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /backend/javascript-typescript

  backend-dependency-vulnerability-scanning:
    name: Backend Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: backend-validation
    defaults:
      run:
        working-directory: ${{ env.BACKEND_APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  backend-secret-scanning-trufflehog:
    name: Backend Secret Scanning - TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo --only-verified --fail

  backend-docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - backend-mongodb-integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.BACKEND_LOCAL_IMAGE }}

      - name: Save Docker image
        run: docker save "${BACKEND_LOCAL_IMAGE}" -o "${RUNNER_TEMP}/backend-image.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          if-no-files-found: error
          retention-days: 1

  backend-container-scan:
    name: Backend Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: backend-docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load -i "${RUNNER_TEMP}/backend-image.tar"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_LOCAL_IMAGE }}
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          vuln-type: os,library
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-results
          path: trivy-backend-results.sarif
          if-no-files-found: warn
          retention-days: 7

  backend-sbom:
    name: Backend SBOM - Syft
    runs-on: ubuntu-latest
    needs: backend-docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load -i "${RUNNER_TEMP}/backend-image.tar"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_LOCAL_IMAGE }}
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-spdx
          path: backend-sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  backend-publish-image:
    name: Backend CD - Publish Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend-docker-build
      - backend-sast-codeql
      - backend-dependency-vulnerability-scanning
      - backend-secret-scanning-trufflehog
      - backend-container-scan
      - backend-sbom
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      image-tag: ${{ github.sha }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load -i "${RUNNER_TEMP}/backend-image.tar"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag "${BACKEND_LOCAL_IMAGE}" "${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${BACKEND_LOCAL_IMAGE}" "${BACKEND_IMAGE_NAME}:latest"

      - name: Push Docker image
        run: |
          docker push "${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${BACKEND_IMAGE_NAME}:latest"
