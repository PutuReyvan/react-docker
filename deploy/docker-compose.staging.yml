services:
  react-app:
    image: ghcr.io/putureyvan/invoice-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: invoice-app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
