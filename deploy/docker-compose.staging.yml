services:
  mongodb:
    image: mongo:8
    container_name: invoice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  invoice-api:
    image: ghcr.io/putureyvan/invoice-api:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: invoice-api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: invoice_app
      PORT: 3001
      CORS_ORIGIN: http://localhost
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  react-app:
    image: ghcr.io/putureyvan/invoice-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: invoice-app
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      invoice-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb-data:
